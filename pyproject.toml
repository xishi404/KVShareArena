[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvsharearena"
version = "0.1.0"
description = "KVShareArena: harness, method contract and CPU scorer for KV-cache reuse across contexts and checkpoints"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
runtime = ["torch>=2.1", "transformers==4.52.4", "numpy"]
kvpress = ["kvpress==0.2.10"]
hub = ["huggingface_hub"]
frames = ["lxml>=5", "huggingface_hub"]   # `kva data rebuild-frames`

[project.scripts]
kva = "kvsharearena.cli:main"

[tool.setuptools]
packages = ["kvsharearena", "kvsharearena.drivers"]

[tool.setuptools.package-data]
kvsharearena = ["assets/*.json", "assets/anchors/*.json"]
